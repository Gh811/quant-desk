<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史回测 · Quant Desk</title>
<link rel="stylesheet" href="./backtest.css">
<main>
<a id="backtest-return" href="./">← 返回交易仪表盘</a>
<h1 id="backtest-title">历史回测</h1>
<div id="backtest-list">
<form id="backtest">
  <label>行情来源<select name="source"><option value="live">币安实盘</option><option value="demo">币安模拟盘</option></select></label>
  <label>区间<select name="days"><option value="1">最近 1 天</option><option value="7" selected>最近 7 天</option><option value="14">最近 14 天</option><option value="30">最近 30 天</option><option value="60">最近 60 天</option><option value="90">最近 90 天</option><option value="180">最近 180 天</option><option value="365">最近 365 天</option><option value="days">自定义天数</option><option value="custom">自定义日期</option></select></label>
  <label id="custom-days" hidden>最近天数<input type="number" name="day_count" min="1" step="1" value="90" disabled></label>
  <div id="custom-range" hidden><label>开始日期<input type="date" name="start"></label><label>结束日期<input type="date" name="end"></label></div>
  <fieldset class="backtest-assets"><legend>回测标的</legend>
    <input id="search-assets" type="search" aria-label="搜索标的" placeholder="搜索标的">
    <button type="button" id="select-assets">选中搜索结果</button>
    <button type="button" id="clear-assets">清空</button><div id="asset"></div>
  </fieldset>
  <button type="submit">开始回测</button>
</form>
<p id="status" role="status">当前 5 分钟双向策略 · 各标的以 10,000 USDT 独立回放 · 北京时间</p>
<div class="panel">
  <h2>回测记录</h2>
  <label>记录来源<select id="history-source"><option value="live">币安实盘</option><option value="demo">币安模拟盘</option></select></label>
  <label>筛选标的<input id="history-asset" type="search" placeholder="例如 BTC 或 BTCUSDT"></label>
  <div id="history"></div>
  <button type="button" id="history-prev">上一页</button>
  <span id="history-page"></span>
  <button type="button" id="history-next">下一页</button>
</div>
</div>
<p id="detail-status" role="status" hidden></p>
<div id="results"></div>
<details><summary>数据与成交假设</summary>
  <p>只运行当前 5 分钟双向策略。信号使用已收盘的 5 分钟、15 分钟和 1 小时 K 线，持仓复评及止盈止损使用分钟级行情。历史覆盖不足会缩短区间，结果页显示实际区间。区间内有数据缺口会单独标记该标的失败。</p>
  <p>按下一分钟开盘价和滑点估算入场，止盈止损用 1 分钟标记价判断，同一根同时碰到两条线时按止损计算。单边手续费 0.05%，单边滑点 0.03%，另计历史资金费。盘口排队、部分成交与多标的共用保证金未纳入。</p>
</details>
</main>
<script src="./backtest.js"></script></html>
